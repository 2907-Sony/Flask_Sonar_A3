name: SonarQube Cloud

# Run on every push to main, plus a manual "Run workflow" button
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code
permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so SonarQube can detect new code and blame lines

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"   # TensorFlow 2.10 requires Python 3.10
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
