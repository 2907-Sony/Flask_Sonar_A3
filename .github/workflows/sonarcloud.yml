name: SonarQube Cloud

# Run on every push to main, plus a manual "Run workflow" button
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code
permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0   # full history so SonarQube can detect new code and blame lines

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.10"   # TensorFlow 2.10 requires Python 3.10
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
