# SonarQube Cloud project identity (exact values from SonarQube Cloud)
sonar.projectKey=2907-Sony_Flask_Sonar_A3
sonar.organization=2907-sony
sonar.projectName=Flask_Sonar_A3

# Analysis scope: application code is the source; tests are analysed as tests
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,test_images/**,**/*.h5,**/__pycache__/**,coverage.xml
sonar.test.inclusions=tests/**/*.py

# Python settings and coverage report produced by pytest-cov
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=lint.py,tests/**

sonar.sourceEncoding=UTF-8
